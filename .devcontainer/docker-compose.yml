services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    mem_limit: 8g
    cpus: 4
    pids_limit: 512
    command: sleep infinity
    volumes:
      - ..:/workspaces/remnote-graph-rag
      - hf-cache:/home/vscode/.cache/huggingface
      - ${HOME}/.codex-devcontainers/remnote-graph-rag:/home/vscode/.codex
    env_file:
      - ../.env
    environment:
      EMBEDDER_MODEL_PATH: /workspaces/remnote-graph-rag/models/all-MiniLM-L6-v2
      HF_HOME: /home/vscode/.cache/huggingface
      SENTENCE_TRANSFORMERS_HOME: /home/vscode/.cache/huggingface/sentence-transformers
    depends_on:
      - redis
      - memgraph
      - mongodb

  redis:
    image: redis/redis-stack-server:7.4.0-v8-arm64
    volumes:
      - redis-data:/data

  memgraph:
    image: memgraph/memgraph-mage:3.12.0
    volumes:
      - memgraph-data:/var/lib/memgraph
      - memgraph-log:/var/log/memgraph
      - memgraph-etc:/etc/memgraph

  lab:
    image: memgraph/lab
    ports:
      - "3001:3000"
    environment:
      QUICK_CONNECT_MG_HOST: memgraph
      QUICK_CONNECT_MG_PORT: "7687"
    depends_on:
      - memgraph

  mongodb:
    image: mongo:8.2.6
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: password
    volumes:
      - mongodb-data:/data/db

volumes:
  hf-cache:
  redis-data:
  memgraph-data:
  memgraph-log:
  memgraph-etc:
  mongodb-data:
