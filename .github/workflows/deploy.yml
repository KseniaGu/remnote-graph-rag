name: Deploy to Cloud Run

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  REGION: ${{ vars.REGION }}
  ARTIFACT_REGISTRY_REPOSITORY: ${{ vars.ARTIFACT_REGISTRY_REPOSITORY }}
  BACKEND_SERVICE_NAME: ${{ vars.BACKEND_SERVICE_NAME }}
  FRONTEND_SERVICE_NAME: ${{ vars.FRONTEND_SERVICE_NAME }}
  # LANGSMITH_EXPORT_JOB_NAME: langsmith-export
  # LANGSMITH_EXPORT_SCHEDULER_NAME: langsmith-export-daily
  MODEL_BUCKET_NAME: ${{ vars.MODEL_BUCKET_NAME }}
  MODEL_CACHE_BUILD_DIR: .docker-build/sentence-transformers
  RUNTIME_STORAGE_BUCKET_NAME: remnote-graph-rag-storage
  RUNTIME_STORAGE_BUILD_DIR: .docker-build/runtime-storage

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Validate required configuration
        run: |
          set -euo pipefail
          REQUIRED_VARS=(PROJECT_ID REGION ARTIFACT_REGISTRY_REPOSITORY BACKEND_SERVICE_NAME FRONTEND_SERVICE_NAME)
          for var in "${REQUIRED_VARS[@]}"; do
            if [ -z "${!var:-}" ]; then
              echo "Missing required env var: $var"
              exit 1
            fi
          done
          echo "Configuration OK"

      - name: Free disk space on runner
        run: |
          echo "Disk usage before cleanup:"
          df -h
          sudo rm -rf /usr/share/dotnet || true
          sudo rm -rf /usr/local/lib/android || true
          sudo rm -rf /opt/ghc || true
          sudo apt-get clean || true
          docker system prune -af || true
          docker builder prune -af || true
          echo "Disk usage after cleanup:"
          df -h

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker $REGION-docker.pkg.dev --quiet --project "$PROJECT_ID"

      - name: Download retrieval models from Cloud Storage
        run: |
          set -euo pipefail
          rm -rf "$MODEL_CACHE_BUILD_DIR"
          mkdir -p "$MODEL_CACHE_BUILD_DIR"
          gcloud storage rsync --recursive "gs://$MODEL_BUCKET_NAME/sentence-transformers" "$MODEL_CACHE_BUILD_DIR"

          if [ -d "$MODEL_CACHE_BUILD_DIR/sentence-transformers" ]; then
            echo "Unexpected nested sentence-transformers directory under $MODEL_CACHE_BUILD_DIR"
            find "$MODEL_CACHE_BUILD_DIR" -maxdepth 2 -type d | sort
            exit 1
          fi

          if [ -z "$(find "$MODEL_CACHE_BUILD_DIR" -mindepth 1 -maxdepth 1 -print -quit)" ]; then
            echo "No retrieval model files were copied from gs://$MODEL_BUCKET_NAME/sentence-transformers"
            exit 1
          fi

      - name: Download runtime storage from Cloud Storage
        run: |
          set -euo pipefail
          rm -rf "$RUNTIME_STORAGE_BUILD_DIR"
          mkdir -p "$RUNTIME_STORAGE_BUILD_DIR"
          gcloud storage cp "gs://$RUNTIME_STORAGE_BUCKET_NAME/docstore.json" "$RUNTIME_STORAGE_BUILD_DIR/docstore.json"
          gcloud storage cp "gs://$RUNTIME_STORAGE_BUCKET_NAME/property_graph_store.json" "$RUNTIME_STORAGE_BUILD_DIR/property_graph_store.json"

          if [ ! -s "$RUNTIME_STORAGE_BUILD_DIR/docstore.json" ]; then
            echo "No runtime docstore was copied from gs://$RUNTIME_STORAGE_BUCKET_NAME/docstore.json"
            exit 1
          fi
          if [ ! -s "$RUNTIME_STORAGE_BUILD_DIR/property_graph_store.json" ]; then
            echo "No runtime property_graph_store was copied from gs://$RUNTIME_STORAGE_BUCKET_NAME/property_graph_store.json"
            exit 1
          fi

      - name: Build backend Docker image
        run: |
          DOCKER_BUILDKIT=1 docker build \
            --build-context model-cache="$MODEL_CACHE_BUILD_DIR" \
            --build-context runtime-storage="$RUNTIME_STORAGE_BUILD_DIR" \
            -t $REGION-docker.pkg.dev/$PROJECT_ID/$ARTIFACT_REGISTRY_REPOSITORY/remnote-graph-rag-backend:${{ github.sha }} \
            -f deploy/Dockerfile .

      - name: Push backend Docker image
        run: |
          docker push $REGION-docker.pkg.dev/$PROJECT_ID/$ARTIFACT_REGISTRY_REPOSITORY/remnote-graph-rag-backend:${{ github.sha }}

      - name: Deploy backend to Cloud Run
        run: |
          gcloud run deploy $BACKEND_SERVICE_NAME \
            --image $REGION-docker.pkg.dev/$PROJECT_ID/$ARTIFACT_REGISTRY_REPOSITORY/remnote-graph-rag-backend:${{ github.sha }} \
            --platform managed \
            --project $PROJECT_ID \
            --region $REGION \
            --port 8000 \
            --quiet \
            --allow-unauthenticated \
            --memory 2Gi \
            --cpu 2 \
            --timeout 300 \
            --min-instances 1 \
            --max-instances 10 \
            --cpu-boost \
            --service-account ${{ secrets.CLOUD_RUN_SERVICE_ACCOUNT }} \
            --network=default \
            --subnet=default \
            --vpc-egress=private-ranges-only \
            --command reflex \
            --args run,--env,prod,--backend-only,--backend-host,0.0.0.0 \
            --set-secrets "REDIS_HOST=redis-host:latest" \
            --set-secrets "REDIS_PORT=redis-port:latest" \
            --set-secrets "REDIS_PASSWORD=redis-password:latest" \
            --set-env-vars "REDIS_INIT_FROM_LOCAL=false" \
            --set-secrets "MONGODB_URI=mongodb-uri:latest" \
            --set-secrets "PINECONE_API_KEY=pinecone-api-key:latest" \
            --set-secrets "PINECONE_ENVIRONMENT=pinecone-environment:latest" \
            --set-secrets "PINECONE_INDEX_NAME=pinecone-index-name:latest" \
            --set-env-vars "PINECONE_INIT_FROM_LOCAL=false" \
            --set-secrets "MEMGRAPH_URI=memgraph-uri:latest" \
            --set-secrets "MEMGRAPH_USERNAME=memgraph-username:latest" \
            --set-secrets "MEMGRAPH_PASSWORD=memgraph-password:latest" \
            --set-secrets "MEMGRAPH_DATABASE=memgraph-database:latest" \
            --set-env-vars "MEMGRAPH_INIT_FROM_LOCAL=false" \
            --set-secrets "OLLAMA_API_KEY=ollama-api-key:latest" \
            --set-secrets "TAVILY_API_KEY=tavily-api-key:latest" \
            --set-secrets "COHERE_API_KEY=cohere-api-key:latest" \
            --set-secrets "LANGSMITH_API_KEY=langchain-api-key:latest" \
            --set-env-vars "LANGSMITH_TRACING=true" \
            --set-env-vars "LANGSMITH_PROJECT=remnote-graph-rag" \
            --set-env-vars "LANGSMITH_ENDPOINT=https://eu.api.smith.langchain.com"

      # - name: Deploy LangSmith export Cloud Run job
      #   run: |
      #     gcloud run jobs deploy $LANGSMITH_EXPORT_JOB_NAME \
      #       --image $REGION-docker.pkg.dev/$PROJECT_ID/$ARTIFACT_REGISTRY_REPOSITORY/remnote-graph-rag-backend:${{ github.sha }} \
      #       --project $PROJECT_ID \
      #       --region $REGION \
      #       --memory 512Mi \
      #       --cpu 1 \
      #       --task-timeout 120 \
      #       --max-retries 1 \
      #       --service-account ${{ secrets.CLOUD_RUN_SERVICE_ACCOUNT }} \
      #       --network=default \
      #       --subnet=default \
      #       --vpc-egress=private-ranges-only \
      #       --command python \
      #       --args=-m,scripts.export_langsmith_logs,--frequency,daily \
      #       --set-secrets "MONGODB_URI=mongodb-uri:latest" \
      #       --set-secrets "LANGSMITH_API_KEY=langchain-api-key:latest" \
      #       --set-env-vars "LANGSMITH_TRACING=true" \
      #       --set-env-vars "LANGSMITH_PROJECT=remnote-graph-rag" \
      #       --set-env-vars "LANGSMITH_ENDPOINT=https://eu.api.smith.langchain.com" \
      #       --quiet

      # - name: Create Cloud Scheduler trigger for LangSmith export
      #   run: |
      #     if gcloud scheduler jobs describe $LANGSMITH_EXPORT_SCHEDULER_NAME \
      #       --project $PROJECT_ID --location $REGION &>/dev/null; then
      #       gcloud scheduler jobs update http $LANGSMITH_EXPORT_SCHEDULER_NAME \
      #         --project $PROJECT_ID \
      #         --location $REGION \
      #         --schedule "0 2 * * *" \
      #         --time-zone "UTC" \
      #         --uri "https://$REGION-run.googleapis.com/apis/run.googleapis.com/v1/namespaces/$PROJECT_ID/jobs/$LANGSMITH_EXPORT_JOB_NAME:run" \
      #         --http-method POST \
      #         --oauth-service-account-email ${{ secrets.CLOUD_RUN_SERVICE_ACCOUNT }} \
      #         --quiet
      #     else
      #       gcloud scheduler jobs create http $LANGSMITH_EXPORT_SCHEDULER_NAME \
      #         --project $PROJECT_ID \
      #         --location $REGION \
      #         --schedule "0 2 * * *" \
      #         --time-zone "UTC" \
      #         --uri "https://$REGION-run.googleapis.com/apis/run.googleapis.com/v1/namespaces/$PROJECT_ID/jobs/$LANGSMITH_EXPORT_JOB_NAME:run" \
      #         --http-method POST \
      #         --oauth-service-account-email ${{ secrets.CLOUD_RUN_SERVICE_ACCOUNT }} \
      #         --quiet
      #     fi

      - name: Get backend URL
        run: |
          BACKEND_URL=$(gcloud run services describe $BACKEND_SERVICE_NAME --project $PROJECT_ID --region $REGION --format 'value(status.url)')
          echo "BACKEND_URL=$BACKEND_URL" >> $GITHUB_ENV

      - name: Build frontend Docker image (static export)
        run: |
          docker build \
            --build-arg API_URL=$BACKEND_URL \
            -t $REGION-docker.pkg.dev/$PROJECT_ID/$ARTIFACT_REGISTRY_REPOSITORY/remnote-graph-rag-frontend:${{ github.sha }} \
            -f deploy/Dockerfile.frontend .

      - name: Push frontend Docker image
        run: |
          docker push $REGION-docker.pkg.dev/$PROJECT_ID/$ARTIFACT_REGISTRY_REPOSITORY/remnote-graph-rag-frontend:${{ github.sha }}

      - name: Deploy frontend to Cloud Run
        run: |
          gcloud run deploy $FRONTEND_SERVICE_NAME \
            --image $REGION-docker.pkg.dev/$PROJECT_ID/$ARTIFACT_REGISTRY_REPOSITORY/remnote-graph-rag-frontend:${{ github.sha }} \
            --platform managed \
            --project $PROJECT_ID \
            --region $REGION \
            --port 8080 \
            --quiet \
            --allow-unauthenticated \
            --memory 512Mi \
            --cpu 1 \
            --service-account ${{ secrets.CLOUD_RUN_SERVICE_ACCOUNT }} \
            --timeout 300 \
            --min-instances 0 \
            --max-instances 10 \
            --command caddy \
            --args run,--config,/etc/caddy/Caddyfile,--adapter,caddyfile

      - name: Show deployment URLs
        run: |
          BACKEND_URL=$(gcloud run services describe $BACKEND_SERVICE_NAME --project $PROJECT_ID --region $REGION --format 'value(status.url)')
          FRONTEND_URL=$(gcloud run services describe $FRONTEND_SERVICE_NAME --project $PROJECT_ID --region $REGION --format 'value(status.url)')
          echo "Backend: $BACKEND_URL"
          echo "Frontend: $FRONTEND_URL"
