[project]
name = "remnote-graph-rag"
version = "0.1.0"
description = "A Graph RAG system based on RemNote knowledge base."
authors = [{ name = "Fuku Ro", email = "keguryanova@gmail.com" }]
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "pydantic-settings>=2.12.0,<3.0.0",
    "ollama>=0.6.1,<0.7.0",
    "llama-index>=0.14.12,<0.15.0",
    "llama-index-storage-docstore-redis>=0.4.1,<0.5.0",
    "llama-index-storage-index-store-redis>=0.5.1,<0.6.0",
    "llama-index-embeddings-huggingface>=0.6.1,<0.7.0",
    "llama-index-graph-stores-neo4j>=0.5.1,<0.6.0",
    "llama-index-graph-stores-memgraph>=0.5.0,<0.6.0",
    "llama-index-llms-ollama>=0.9.1,<0.10.0",
    "llama-index-embeddings-ollama>=0.8.6,<0.9.0",
    "llama-index-postprocessor-cohere-rerank>=0.5.1,<0.6.0",
    "llama-index-vector-stores-pinecone>=0.7.1,<0.8.0",
    "llama-index-vector-stores-redis>=0.8.0,<0.9.0",
    "langchain>=1.2.0,<2.0.0",
    "langchain-ollama>=1.0.1,<2.0.0",
    "langchain-openai>=1.1.0,<2.0.0",
    "langchain-google-genai>=4.2.0,<5.0.0",
    "langsmith>=0.7.0,<0.8.0",
    "sentence-transformers>=5.5.1,<6.0.0",
    "tenacity>=9.1.0,<10.0.0",
    "structlog>=24.0.0,<25.0.0",
    "tavily-python>=0.7.17,<0.8.0",
    "reflex>=0.8.26,<0.9.0",
    "plotly>=6.5.2,<7.0.0",
    "pymupdf>=1.26.7,<2.0.0",
    "neo4j==5.28.2",
    "langgraph-checkpoint-mongodb>=0.3.1,<0.4.0",
    "torch>=2.13.0,<3.0.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1,<10.0.0",
    "ruff>=0.16.1,<0.17.0",
]
scripts = [
    "paddleocr>=3.6.0,<4.0.0",
    "paddlex[ocr]>=3.6.1,<4.0.0",
    "paddlepaddle>=3.2.2,<4.0.0",
    "trafilatura>=2.1.0,<3.0.0",
    "huggingface-hub>=1.20.1,<2.0.0",
    "networkx>=3.6.1,<4.0.0",
]

[tool.uv]
package = false
required-version = "==0.12.3"
default-groups = ["dev"]

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.ruff]
target-version = "py311"
line-length = 88
src = ["."]

extend-exclude = [
    # Agent and development-environment metadata
    ".agents",
    ".codex",
    ".devcontainer",
    ".github",

    # Generated and runtime directories
    ".states",
    ".web",

    # Non-source project content
    "app/lib",
    "app/assets",
    "data",
    "docs",
    "exports",
    "models",
    "storage",
]

force-exclude = true

[tool.ruff.lint]
select = [
    "E4",
    "E7",
    "E9",
    "F",
    "I",
    "B",
    "UP",
    "C4",
    "RUF",
    "ASYNC",
    "PERF",
]
ignore = ["RUF001"]

[tool.ruff.lint.isort]
known-first-party = [
    "app",
    "backend",
    "scripts",
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"

[tool.pytest.ini_options]
pythonpath = ["."]
